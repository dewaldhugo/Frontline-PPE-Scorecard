<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Frontline Safety Fear [PPE Scorecard]{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <style>
    body { background: #f1f5f9; }
    .sidebar { background: #1e293b; }
    .sidebar a { color: #e2e8f0; }
    .sidebar a:hover { background: #334155; }
    .sidebar a.active { background: #2563eb; color: #fff; }
    table.dataTable thead { background: #1e293b; color: #fff; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="flex min-h-screen">
  <!-- Sidebar -->
  <aside class="sidebar w-64 min-h-screen p-4 flex flex-col">
    <div class="mb-6">
      <img src="/static/frontline-logo-white.png" alt="logo" class="w-full mb-3">
    </div>
    <nav class="flex flex-col gap-1">
      <a href="/dashboard" class="px-3 py-2 rounded {% if active=='dashboard' %}active{% endif %}">📊 Dashboard</a>
      <a href="/sectors" class="px-3 py-2 rounded {% if active=='sectors' %}active{% endif %}">🗂️ Sectors</a>
      <a href="/emails" class="px-3 py-2 rounded {% if active=='emails' %}active{% endif %}">✉️ Emails</a>
      <a href="/media" class="px-3 py-2 rounded {% if active=='media' %}active{% endif %}">🖼️ Media Library</a>
      <a href="/send" class="px-3 py-2 rounded {% if active=='send' %}active{% endif %}">🚀 Send Campaign</a>
      <a href="/import" class="px-3 py-2 rounded {% if active=='import' %}active{% endif %}">📥 Import Leads</a>
      <a href="/config" class="px-3 py-2 rounded {% if active=='config' %}active{% endif %}">⚙️ Config</a>
    </nav>
    <div class="mt-auto pt-4 border-t border-slate-600">
      <div class="text-sm text-slate-300 mb-2">{{ user or 'Guest' }}</div>
      <a href="/logout" class="text-red-400 text-sm hover:underline">Log out</a>
    </div>
  </aside>
  <!-- Main -->
  <main class="flex-1 p-6">
    {% if flash %}
    <div class="mb-4 p-3 rounded bg-blue-100 text-blue-800">{{ flash }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
