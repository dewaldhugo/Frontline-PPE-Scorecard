<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Frontline Safety Fear [PPE Scorecard]</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-100">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <img src="/static/frontline-logo-white.png" alt="logo" class="w-48 mx-auto mb-6 bg-slate-800 p-2 rounded">
    <h1 class="text-2xl font-bold text-center mb-6 text-slate-800">Login</h1>
    {% if error %}
    <div class="mb-4 p-3 rounded bg-red-100 text-red-800">{{ error }}</div>
    {% endif %}
    {% if info %}
    <div class="mb-4 p-3 rounded bg-blue-100 text-blue-800">{{ info }}</div>
    {% endif %}
    <form method="post" action="/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700">Email</label>
        <input type="email" name="email" required class="mt-1 w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700">Password</label>
        <input type="password" name="password" required class="mt-1 w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Log in</button>
    </form>
    <details class="mt-4">
      <summary class="cursor-pointer text-sm text-blue-600">Forgot password?</summary>
      <form method="post" action="/reset-request" class="mt-2 space-y-2">
        <input type="email" name="email" placeholder="Account email" class="w-full border border-slate-300 rounded px-3 py-2">
        <button type="submit" class="w-full bg-slate-600 text-white py-2 rounded hover:bg-slate-700">Send reset token</button>
      </form>
      {% if reset_token %}
      <div class="mt-2 p-2 bg-green-100 text-green-800 rounded text-sm">Token: {{ reset_token }}</div>
      {% endif %}
      <form method="post" action="/reset-confirm" class="mt-2 space-y-2">
        <input type="text" name="token" placeholder="Reset token" class="w-full border border-slate-300 rounded px-3 py-2">
        <input type="password" name="new_password" placeholder="New password" class="w-full border border-slate-300 rounded px-3 py-2">
        <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">Reset password</button>
      </form>
    </details>
  </div>
</body>
</html>
