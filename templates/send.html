{% extends "base.html" %}
{% block title %}Send Campaign - Frontline Safety Fear [PPE Scorecard]{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">🚀 Send Campaign</h1>

<!-- Send form -->
<div class="bg-white p-4 rounded shadow">
  <h2 class="text-lg font-semibold mb-3">Execute a send</h2>
  <form method="post" action="/send" class="space-y-4">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700">Sector</label>
        <select name="sector" class="w-full border border-slate-300 rounded px-3 py-2">
          {% for s in sector_options %}<option value="{{ s.name }}">{{ s.name }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700">Volume (max leads)</label>
        <input type="number" name="volume" value="10" min="1" max="250" class="w-full border border-slate-300 rounded px-3 py-2">
      </div>
    </div>
    <div class="flex gap-4">
      <label class="flex items-center gap-2"><input type="checkbox" name="dry_run" checked> Dry run</label>
      <label class="flex items-center gap-2"><input type="checkbox" name="live"> Force live</label>
    </div>
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Run send</button>
  </form>
  {% if output %}
  <div class="mt-4">
    <h3 class="font-semibold mb-2">Output</h3>
    <pre class="bg-slate-900 text-green-300 p-3 rounded text-sm overflow-auto max-h-96">{{ output }}</pre>
    {% if error %}<pre class="bg-red-900 text-red-200 p-3 rounded text-sm overflow-auto max-h-48 mt-2">{{ error }}</pre>{% endif %}
  </div>
  {% endif %}
</div>
{% endblock %}
